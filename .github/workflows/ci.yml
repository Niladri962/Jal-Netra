name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -r requirements.txt pytest
      - name: Unit + end-to-end tests
        run: pytest -q
      - name: Multi-seed detection benchmark
        run: python run_simulation.py --benchmark 5
      - name: Site builds
        run: python build_site.py
